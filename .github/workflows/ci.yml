name: CI

# Runs on every pull request and on main: the CLI's Jest suite (packages/cli), the
# root Vitest suite (the app's route/contract tests plus the MCP server's tests), the
# local hub's tests (packages/app), and two checks that keep generated and loop files
# honest: the plugin in plugin/ is what a build writes, and the loops and goals in
# design/ are well-formed. The other workflows here are scheduled loop jobs.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: CLI tests (Jest)
        run: npm --prefix packages/cli test

      - name: App + MCP tests (Vitest)
        run: npm test

      - name: Local hub tests (node --test)
        run: npm --prefix packages/app test

      - name: Plugin is up to date with its sources
        run: node packages/cli/scripts/build-plugin.js --check

      - name: Loops and goals are well-formed
        run: node packages/cli/bin/cli.js loops check

      - name: Docs sources compile (source.config.ts may only export collections)
        run: npx fumadocs-mdx

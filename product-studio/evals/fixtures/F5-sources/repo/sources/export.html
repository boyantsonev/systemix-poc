<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Acme Notes · pricing refresh</title>
<style>:root{
  --background: #ffffff;
  --foreground: #0f172a;
  --card: #ffffff;
  --card-foreground: #0f172a;
  --muted: #f1f5f9;
  --muted-foreground: #475569;
  --primary: #4338ca;
  --primary-foreground: #ffffff;
  --accent: #e0e7ff;
  --accent-foreground: #312e81;
  --border: #e2e8f0;
  --highlight: #fef3c7;
  --highlight-foreground: #78350f;
  --ink: #000000;
  --radius: 10px;
  --font-size-base: 1rem;
}
body{background:var(--background);color:var(--foreground);font-family:system-ui,sans-serif}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px}
.cta{background:var(--primary);color:var(--primary-foreground);border-radius:var(--radius)}
</style>
</head>
<body>
<main>
  <h1>Pricing</h1>
  <article class="card">
    <h2>Team</h2>
    <p>$8 per person, per month, billed yearly</p>
    <button class="cta">Choose this plan</button>
  </article>
</main>
</body>
</html>
